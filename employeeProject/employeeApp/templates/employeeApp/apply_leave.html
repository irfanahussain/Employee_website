{% extends "base.html" %}
{% block title %}Apply for Leave{% endblock %}
{% block content %}
<div class="page-header"><h1>Apply for Leave</h1></div>
<div class="table-card" style="max-width:560px;">
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Submit Request</button>
        <a href="{% url 'employeeApp:my_leave_requests' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
